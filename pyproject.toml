[project]
name = "cur-kit"
version = "0.1.0"
description = "Always Run TDD harness for Spec Kit on Cursor"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["curkit"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
